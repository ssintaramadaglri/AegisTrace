<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="AegisTrace execution pipeline">
  <title>AegisTrace execution pipeline</title>
  <desc>Data flow from YAML workflow source through strict compile and static verify into a sealed artifact, then live execution that records a hash chained journal, checkpoints, and a signed proof, with a separate offline replay path that never contacts a provider.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7d5b"/>
    </marker>
    <marker id="tipRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b23b3b"/>
    </marker>
  </defs>

  <rect width="760" height="300" fill="#0f1a24"/>
  <rect x="0" y="0" width="760" height="4" fill="#2f7d5b"/>
  <text x="24" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e6eef4">AegisTrace verifiable execution</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">
    <!-- source -->
    <rect x="24" y="66" width="120" height="46" rx="6" fill="#182937" stroke="#3c5468"/>
    <text x="84" y="88" fill="#e6eef4">workflow.yaml</text>
    <text x="84" y="104" fill="#8ba6bc" font-size="11">strict source</text>

    <!-- compile -->
    <rect x="188" y="66" width="120" height="46" rx="6" fill="#182937" stroke="#3c5468"/>
    <text x="248" y="88" fill="#e6eef4">compile</text>
    <text x="248" y="104" fill="#8ba6bc" font-size="11">reject unknown fields</text>

    <!-- verify -->
    <rect x="352" y="66" width="120" height="46" rx="6" fill="#182937" stroke="#3c5468"/>
    <text x="412" y="88" fill="#e6eef4">static verify</text>
    <text x="412" y="104" fill="#8ba6bc" font-size="11">DAG, budgets, perms</text>

    <!-- sealed artifact -->
    <rect x="516" y="60" width="220" height="58" rx="6" fill="#12352a" stroke="#2f7d5b" stroke-width="2"/>
    <text x="626" y="84" fill="#bfe6d3" font-weight="700">sealed .aegis artifact</text>
    <text x="626" y="103" fill="#7fbfa1" font-size="11">sha256 digest</text>
  </g>

  <!-- top row connectors -->
  <g stroke="#2f7d5b" stroke-width="2" fill="none" marker-end="url(#tip)">
    <line x1="144" y1="89" x2="184" y2="89"/>
    <line x1="308" y1="89" x2="348" y2="89"/>
    <line x1="472" y1="89" x2="512" y2="89"/>
  </g>

  <!-- rejection branch off verify -->
  <path d="M412 112 L412 150" stroke="#b23b3b" stroke-width="2" fill="none" marker-end="url(#tipRed)"/>
  <text x="422" y="146" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#e0a0a0">cycles and undeclared effects rejected</text>

  <!-- execution row -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="516" y="150" width="220" height="46" rx="6" fill="#182937" stroke="#3c5468"/>
    <text x="626" y="172" fill="#e6eef4">runtime execution</text>
    <text x="626" y="188" fill="#8ba6bc" font-size="11">budgets and approvals</text>

    <rect x="516" y="212" width="104" height="42" rx="6" fill="#182937" stroke="#3c5468"/>
    <text x="568" y="230" fill="#e6eef4" font-size="12">provider</text>
    <text x="568" y="245" fill="#8ba6bc" font-size="10">model / MCP / tool</text>

    <rect x="632" y="212" width="104" height="42" rx="6" fill="#182937" stroke="#3c5468"/>
    <text x="684" y="230" fill="#e6eef4" font-size="12">checkpoint</text>
    <text x="684" y="245" fill="#8ba6bc" font-size="10">atomic state</text>

    <!-- journal + proof -->
    <rect x="24" y="212" width="150" height="46" rx="6" fill="#182937" stroke="#3c5468"/>
    <text x="99" y="234" fill="#e6eef4">hash-chained .atlog</text>
    <text x="99" y="250" fill="#8ba6bc" font-size="11">append-only journal</text>

    <rect x="206" y="212" width="150" height="46" rx="6" fill="#12352a" stroke="#2f7d5b" stroke-width="2"/>
    <text x="281" y="234" fill="#bfe6d3">signed Merkle proof</text>
    <text x="281" y="250" fill="#7fbfa1" font-size="11">Ed25519 inclusion</text>

    <rect x="388" y="212" width="104" height="46" rx="6" fill="#182937" stroke="#3c5468"/>
    <text x="440" y="234" fill="#e6eef4" font-size="12">offline replay</text>
    <text x="440" y="250" fill="#8ba6bc" font-size="10">no provider call</text>
  </g>

  <!-- artifact to runtime -->
  <path d="M626 118 L626 146" stroke="#2f7d5b" stroke-width="2" fill="none" marker-end="url(#tip)"/>

  <!-- runtime to provider / checkpoint -->
  <g stroke="#2f7d5b" stroke-width="2" fill="none" marker-end="url(#tip)">
    <path d="M600 196 L568 208"/>
    <path d="M652 196 L684 208"/>
  </g>

  <!-- runtime to journal (recorded effects) -->
  <path d="M516 178 C 300 178, 160 190, 108 208" stroke="#2f7d5b" stroke-width="2" fill="none" marker-end="url(#tip)"/>
  <!-- journal to proof and replay -->
  <g stroke="#2f7d5b" stroke-width="2" fill="none" marker-end="url(#tip)">
    <path d="M174 235 L202 235"/>
    <path d="M356 235 L384 235"/>
  </g>

  <!-- travelling marker down the trusted path to show progression -->
  <circle r="4" fill="#7fd0aa">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M84,112 L84,89 L512,89 M626,118 L626,150 M516,178 C300,178 160,190 108,208 L174,235 L356,235"/>
  </circle>
</svg>
