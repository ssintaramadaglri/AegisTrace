<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" aria-label="AegisTrace proof verification decisions">
  <title>AegisTrace journal and proof verification</title>
  <desc>A hash chained journal of four events feeds a Merkle tree whose root is signed with Ed25519. A decision column shows what verification accepts or rejects: an altered event breaks the chain, a valid inclusion path passes, and replay never contacts a provider.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a6377"/>
    </marker>
  </defs>

  <rect width="700" height="340" fill="#f4f1e9"/>
  <rect x="0" y="0" width="700" height="4" fill="#2f7d5b"/>
  <text x="24" y="34" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1c2b38">Journal chain, Merkle proof, and verification decisions</text>

  <!-- hash chained journal -->
  <text x="24" y="66" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5c6b78">append-only journal (each hash names the previous)</text>
  <g font-family="monospace" font-size="12" text-anchor="middle">
    <g>
      <rect x="24" y="78" width="88" height="44" rx="5" fill="#ffffff" stroke="#4a6377"/>
      <text x="68" y="98" fill="#1c2b38">e0</text>
      <text x="68" y="114" fill="#7c8b98" font-size="10">h0</text>
    </g>
    <g>
      <rect x="140" y="78" width="88" height="44" rx="5" fill="#ffffff" stroke="#4a6377"/>
      <text x="184" y="98" fill="#1c2b38">e1</text>
      <text x="184" y="114" fill="#7c8b98" font-size="10">prev=h0</text>
    </g>
    <g>
      <rect x="256" y="78" width="88" height="44" rx="5" fill="#ffffff" stroke="#4a6377"/>
      <text x="300" y="98" fill="#1c2b38">e2</text>
      <text x="300" y="114" fill="#7c8b98" font-size="10">prev=h1</text>
    </g>
    <g>
      <rect x="372" y="78" width="88" height="44" rx="5" fill="#ffffff" stroke="#4a6377"/>
      <text x="416" y="98" fill="#1c2b38">e3</text>
      <text x="416" y="114" fill="#7c8b98" font-size="10">prev=h2</text>
    </g>
  </g>
  <g stroke="#4a6377" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="112" y1="100" x2="136" y2="100"/>
    <line x1="228" y1="100" x2="252" y2="100"/>
    <line x1="344" y1="100" x2="368" y2="100"/>
  </g>

  <!-- merkle tree -->
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="66" y="158" width="60" height="30" rx="4" fill="#e4ded0" stroke="#8a7f68"/>
    <text x="96" y="177" fill="#3a4a57">n01</text>
    <rect x="298" y="158" width="60" height="30" rx="4" fill="#e4ded0" stroke="#8a7f68"/>
    <text x="328" y="177" fill="#3a4a57">n23</text>
    <rect x="182" y="212" width="80" height="32" rx="4" fill="#12352a" stroke="#2f7d5b" stroke-width="2"/>
    <text x="222" y="228" fill="#bfe6d3" font-size="11">root</text>
    <text x="222" y="240" fill="#7fbfa1" font-size="9">Ed25519</text>
  </g>
  <g stroke="#8a7f68" stroke-width="1.6" fill="none">
    <path d="M68 122 L96 156"/>
    <path d="M184 122 L96 156"/>
    <path d="M300 122 L328 156"/>
    <path d="M416 122 L328 156"/>
    <path d="M96 188 L210 210"/>
    <path d="M328 188 L234 210"/>
  </g>

  <!-- signature sweep to show progression from root to signed proof -->
  <rect x="182" y="212" width="80" height="32" rx="4" fill="none" stroke="#2f7d5b" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- decision column -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">
    <text x="486" y="70" font-weight="700" fill="#1c2b38">Verification decides</text>

    <rect x="486" y="82" width="190" height="40" rx="5" fill="#f7e6e4" stroke="#b23b3b"/>
    <text x="498" y="99" fill="#8a2b2b" font-weight="600">altered event</text>
    <text x="498" y="115" fill="#8a2b2b" font-size="11">chain breaks, replay blocked</text>

    <rect x="486" y="134" width="190" height="40" rx="5" fill="#e6f2ec" stroke="#2f7d5b"/>
    <text x="498" y="151" fill="#1f6349" font-weight="600">valid inclusion path</text>
    <text x="498" y="167" fill="#1f6349" font-size="11">proof verifies without journal</text>

    <rect x="486" y="186" width="190" height="40" rx="5" fill="#e6f2ec" stroke="#2f7d5b"/>
    <text x="498" y="203" fill="#1f6349" font-weight="600">offline replay</text>
    <text x="498" y="219" fill="#1f6349" font-size="11">no provider is contacted</text>

    <rect x="486" y="238" width="190" height="40" rx="5" fill="#f7e6e4" stroke="#b23b3b"/>
    <text x="498" y="255" fill="#8a2b2b" font-weight="600">expired capability</text>
    <text x="498" y="271" fill="#8a2b2b" font-size="11">scope or expiry rejected</text>
  </g>

  <text x="24" y="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5c6b78">A valid artifact proves structure and integrity. It does not certify that a model response is correct or a permitted tool is safe.</text>
  <text x="24" y="320" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#5c6b78">Green marks what AegisTrace verifies. Red marks what it refuses.</text>
</svg>
