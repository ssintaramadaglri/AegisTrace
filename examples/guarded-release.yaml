name: guarded-release
version: "1"
description: Demonstrates a human approval boundary before a side effect
entry: prepare
budget:
  max_steps: 6
  max_tool_calls: 1
  max_tokens: 0
  timeout: 20s
permissions:
  - tool: deployment.release
steps:
  - id: prepare
    kind: emit
    input:
      release: ${input.release}
  - id: authorize
    kind: approval
