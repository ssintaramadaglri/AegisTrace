version: 2
project_name: aegistrace
before:
  hooks:
    - go mod tidy
builds:
  - id: aegis
    main: ./cmd/aegis
    binary: aegis
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
