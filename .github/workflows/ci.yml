name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build -trimpath ./cmd/aegis
      - name: Enforce source file size
        run: |
          oversize=$(find . -name '*.go' -print0 | xargs -0 wc -l | awk '$1 > 500 && $2 != "total" {print}')
          test -z "$oversize" || { echo "$oversize"; exit 1; }
